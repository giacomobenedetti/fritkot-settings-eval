name: PR Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package pull request files
        run: mkdir -p out && cp package.json out/
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: out/
          retention-days: 1
